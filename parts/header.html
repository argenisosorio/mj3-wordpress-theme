/*****************/
/* Media queries */
/*****************/

/* Pantallas grandes (escritorio) */
@media (min-width: 992px) {
    .col-2 {
        display: block;
    }
    .col-4 {
        width: 33.3333%;
    }
    .title-font {
        font-size: 3.5rem;
        background: -webkit-linear-gradient(left, #FFFFFF, gray);
        background: linear-gradient(to right, #FFFFFF, gray); /* versión estándar */
        -webkit-background-clip: text; /* versión con prefijo */
        background-clip: text; /* versión estándar */
        -webkit-text-fill-color: transparent;
    }
}

/* Tablets */
@media (min-width: 768px) and (max-width: 991px) {
    .col-2 {
        display: none;
    }
    .col-4 {
        width: 50%;
    }
    .col-4 img {
        width: 100%;
    }
    .title-font {
        font-size: 3rem;
        background: -webkit-linear-gradient(left, #FFFFFF, gray);
        background: linear-gradient(to right, #FFFFFF, gray); /* versión estándar */
        -webkit-background-clip: text; /* versión con prefijo */
        background-clip: text; /* versión estándar */
        -webkit-text-fill-color: transparent;
    }
}

/* Móviles */
@media (max-width: 767px) {
    .col-2 {
        display: none;
    }
    .col-4 {
        width: 100%;
    }
    .mq-col-4 {
        /*border: ridge 1px green;*/
        margin-left: 15px;
        margin-top: -30px;
    }
    .mq-about-us {
        margin-top: 55px;
    }
    .col-4 img {
        width: 90%;
        margin: 0 auto;
        display: block;
        margin-top: 15px;
    }
    .mapswrapper iframe {
        width: 100%;
        height: auto;
    }
    .title-font {
        font-size: 3rem;
        background: -webkit-linear-gradient(left, #FFFFFF, gray);
        background: linear-gradient(to right, #FFFFFF, gray); /* versión estándar */
        -webkit-background-clip: text; /* versión con prefijo */
        background-clip: text; /* versión estándar */
        -webkit-text-fill-color: transparent;
    }
    .carousel {
        margin: 0 auto;
    }
}

/* Efecto aparición de las secciones */
.section {
    opacity: 0;
    transform: translateY(50px);
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
}

.cintillo {
    opacity: 0;
    transform: translateY(50px);
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
}

.main-navbar {
    opacity: 0;
    transform: translateY(50px);
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
}

.visible {
    opacity: 1;
    transform: translateY(0);
}

.carousel {
    max-width: 600px;
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

.carousel-images {
    display: flex;
    transition: transform 1s ease-in-out;
}

.carousel-images img {
    width: 100%;
    flex-shrink: 0;
    object-fit: cover;
}

/* Barra de progreso */
#progressBar {
